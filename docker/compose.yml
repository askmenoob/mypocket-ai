name: imai

services:

  postgres:
    image: postgres:15
    container_name: imai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - imai-network

  redis:
    image: redis:7-alpine
    container_name: imai-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - ./volumes/redis:/data

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - imai-network

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: imai-evolution

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: ${EVOLUTION_AUTHENTICATION_TYPE}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI}

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379

      TZ: ${TZ}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./volumes/evolution:/evolution/instances

    networks:
      - imai-network

networks:
  imai-network:
    driver: bridge
